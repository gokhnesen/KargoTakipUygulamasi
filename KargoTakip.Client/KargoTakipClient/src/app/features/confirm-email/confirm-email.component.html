<div class="confirm-page">
  <div class="confirm-card">
    <div class="card-header">
      <div class="logo-icon">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none">
          <path d="M20 5L35 12.5V27.5L20 35L5 27.5V12.5L20 5Z" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M20 15L28 19V25L20 29L12 25V19L20 15Z" fill="currentColor"/>
        </svg>
      </div>
      <h1>E-posta Onayı</h1>
      <p>Hesabınızın doğrulanması</p>
    </div>

    <div class="card-body">
      <div *ngIf="loading" class="state-box loading-box">
        <div class="spinner-wrap">
          <svg class="spinner" width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="80" stroke-dashoffset="0"/>
          </svg>
        </div>
        <p>E-posta adresiniz onaylanıyor...</p>
      </div>

      <div *ngIf="!loading && success" class="state-box success-box">
        <div class="icon-wrap success-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M8 12L11 15L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="state-message">{{ message }}</p>
        <button type="button" class="btn-primary" (click)="goToLogin()">Giriş Yap</button>
      </div>

      <div *ngIf="!loading && error" class="state-box error-box">
        <div class="icon-wrap error-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z"/>
          </svg>
        </div>
        <p class="state-message">{{ error }}</p>
        <div class="actions">
          <button type="button" class="btn-primary" (click)="goToLogin()">Giriş Sayfasına Git</button>
          <button type="button" class="btn-secondary" (click)="goHome()">Ana Sayfa</button>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <a routerLink="/login" class="footer-link">Giriş yap</a>
      <span class="sep">·</span>
      <a routerLink="/" class="footer-link">Ana sayfa</a>
    </div>
  </div>
</div>
