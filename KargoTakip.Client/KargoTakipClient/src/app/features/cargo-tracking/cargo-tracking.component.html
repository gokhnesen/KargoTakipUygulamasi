<div class="tracking-container">
  <div class="tracking-header">
    <h1>Kargo Takip</h1>
    <p>Kargo takip numaranızı girerek gönderinizi takip edebilirsiniz</p>
  </div>

  <div class="search-section">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="trackingNumber" 
        placeholder="Takip numarasını giriniz"
        (keyup.enter)="trackCargo($event)"
        class="tracking-input"
      />
      <button 
        type="button"
        (click)="trackCargo($event)" 
        [disabled]="loading"
        class="track-button"
      >
        <span *ngIf="!loading">Sorgula</span>
        <span *ngIf="loading">Sorgulanıyor...</span>
      </button>
    </div>
    
    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>
  </div>
</div>
