<div class="login-container">
  <div class="login-box">
    <h2>Giriş Yap</h2>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>E-posta</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="ornek@email.com"
          required
          [disabled]="loading"
        />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input 
          type="password" 
          [(ngModel)]="password"
          name="password"
          placeholder="********"
          required
          [disabled]="loading"
        />
      </div>
      
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        <span *ngIf="!loading">Giriş Yap</span>
        <span *ngIf="loading">Giriş yapılıyor...</span>
      </button>
      <button type="button" class="back-btn" (click)="goBack()" [disabled]="loading">
        Ana Sayfaya Dön
      </button>
    </form>
  </div>
</div>
