# ELK - Logstash pipeline: TCP + Beats input -> Elasticsearch output
# Aspire Docker aginda Elasticsearch container adi: "elasticsearch"

input {
  # TCP uzerinden JSON log (uygulama loglari icin)
  tcp {
    port => 5000
    codec => json
  }
  # Filebeat vb. icin Beats input (opsiyonel)
  beats {
    port => 5044
  }
}

filter {
  # @timestamp yoksa ekle
  if ![@timestamp] {
    mutate {
      add_field => { "@timestamp" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
  # Hata ayiklamak icin stdout (istege bagli - production'da kapatilabilir)
  stdout { codec => rubydebug }
}
